# Desktop gates on every push and pull request. Mobile gates (G6, G10 on
# devices) need the iOS simulator and the Android emulator and run locally only
# (see README). PIECE names the piece whose gates and size ceiling apply; the
# step that lands a piece updates it.
name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIECE: E1-001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: node tools/gates.mjs --piece "$PIECE" --targets desktop --gates G1,G2,G3,G4,G5,G7,G8,G9,G11
      - name: Commit messages without AI trailers
        if: github.event_name == 'pull_request'
        run: node tools/hooks/commit-msg --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
