<body>
<!-- Planted bug for the rig's self-test (piece E1-002): identical to the
     native oracle, except that every Backspace also drops each "ü" (U+00FC)
     from the text node that holds the caret. The fuzzer must find this
     against bench/oracle/native.html and shrink it to <= 5 steps. -->
<div id="stub" contenteditable="true"><p><br></p></div>
<script src="../oracle/recorder.js"></script>
<script>
  document.getElementById('stub').addEventListener('input', (e) => {
    if (e.inputType !== 'deleteContentBackward') return;
    const sel = getSelection();
    const node = sel && sel.anchorNode;
    if (!node || node.nodeType !== 3 || !node.data.includes('ü')) return;
    const before = node.data.slice(0, sel.anchorOffset).split('ü').length - 1;
    const caret = sel.anchorOffset - before;
    node.data = node.data.replace(/ü/g, '');
    sel.collapse(node, caret);
  });
</script>
</body>
